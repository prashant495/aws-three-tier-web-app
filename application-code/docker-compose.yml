services:
  web-tier:
    build:
     context: ./web-tier
    ports:
      - "3000:80"
    depends_on:
      - app-tier
    networks:
      - app-network

  app-tier:
    build:
     context: ./app-tier
    expose:
      - "4000"
    environment:
      DB_HOST: mysql-db
      DB_USER: root
      DB_PWD: root
      DB_DATABASE: webappdb
    depends_on:
      - mysql-db
    networks:
      - app-network

  mysql-db:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: webappdb
      volumes:
        - app-volume:/var/lib/mysql
      networks:
        - app-network

volumes:
  app-volume:

networks:
  app-network:
